packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  # Install-time telemetry pulled in by swagger-ui-dist; never run it.
  '@scarf/scarf': false
  # Pulled in by next-intl for its optional message extractor (unused here): no native installs.
  '@parcel/watcher': false
  '@swc/core': false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    # Verified working on ESLint 10 (lints apps/web) but the peer range was never widened.
    # Remove once upstream releases catch up.
    eslint-plugin-jsx-a11y>eslint: '10'

overrides:
  # Prisma 7.10 CLI pins vulnerable versions (dev-only, never reached with untrusted input):
  # GHSA for deepmerge-ts <8 (stack exhaustion) and mysql2 <3.23.1 (unused: we run Postgres).
  'deepmerge-ts@<8': ^8.0.2
  'mysql2@<3.23.1': ^3.23.1
  # The React Email preview (dev-only) pins next 16.3.3: GHSA-vcvr-r3jv-pc5j (next/og RCE,
  # fixed in 16.3.6). Same version as apps/web.
  '@react-email/ui>next': 16.3.7
  # autocannon (dev-only benchmark) > hyperid pins uuid 8: GHSA-w5hq-g745-h8pq (fixed in
  # 11.1.1). hyperid only calls uuid.v4(), which uuid 11 still provides to CommonJS.
  'hyperid>uuid': ^11.1.1

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested patterns, no patched release yet. Only
    # reached via @next/eslint-plugin-next > fast-glob (dev-only), expanding our own lint
    # globs, never untrusted input. Remove once a fixed braces ships.
    - GHSA-vfj7-8cjw-p6xm
